<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Crop Recommendation Agent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">🌱 <span>CropAgent</span></a>
        <div class="navbar-actions">
            <button class="btn-icon" id="darkModeToggle" title="Toggle Theme">🌙</button>
            <a href="register.html" class="btn btn-primary">Register</a>
        </div>
    </nav>

    <!-- Login Form Container -->
    <main class="container" style="display: flex; align-items: center; justify-content: center;">
        <div class="form-container">
            <h2 class="form-title">Login</h2>
            
            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="e.g., farmer@domain.com" required>
                    <span id="emailError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter password" required>
                    <span id="passwordError" class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary form-submit-btn">Login</button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Register here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; Crop Recommendation Agent. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
