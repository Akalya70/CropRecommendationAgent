<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Crop Recommendation Agent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">🌱 <span>CropAgent</span></a>
        <div class="navbar-actions">
            <button class="btn-icon" id="darkModeToggle" title="Toggle Theme">🌙</button>
            <a href="login.html" class="btn btn-secondary">Login</a>
        </div>
    </nav>

    <!-- Register Form Container -->
    <main class="container" style="display: flex; align-items: center; justify-content: center;">
        <div class="form-container">
            <h2 class="form-title">Create Account</h2>
            
            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
            <div id="successAlert" class="alert alert-success" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName" class="form-label">Full Name</label>
                    <input type="text" id="fullName" class="form-input" placeholder="e.g., John Doe" required minlength="2">
                    <span id="fullNameError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="e.g., farmer@domain.com" required>
                    <span id="emailError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="phoneNumber" class="form-label">Phone Number</label>
                    <input type="tel" id="phoneNumber" class="form-input" placeholder="e.g., 9876543210" required pattern="[0-9]{10,15}">
                    <span id="phoneNumberError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Minimum 6 characters" required minlength="6">
                    <span id="passwordError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required>
                    <span id="confirmPasswordError" class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary form-submit-btn">Register</button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Crop Recommendation Agent. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
