<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Crop Recommendation Agent</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">🌱 <span>CropAgent</span></a>
        <button class="menu-toggle" id="menuToggle">☰</button>
        <ul class="navbar-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li class="auth-only" style="display: none;"><a href="dashboard.html">Dashboard</a></li>
            <li class="auth-only" style="display: none;"><a href="land-analysis.html">Land Analysis</a></li>
            <li class="auth-only" style="display: none;"><a href="leaf-analysis.html">Leaf Analysis</a></li>
            <li class="auth-only" style="display: none;"><a href="history.html">History</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li class="auth-only" style="display: none;"><a href="profile.html">Profile</a></li>
            <li class="admin-only" style="display: none;"><a href="admin.html">Admin Panel</a></li>
        </ul>
        <div class="navbar-actions">
            <button class="btn-icon" id="darkModeToggle" title="Toggle Theme">🌙</button>
            <span class="auth-only" id="userNameDisplay" style="display: none; font-weight: 600; color: var(--text-primary); margin-right: 0.5rem;"></span>
            <a href="login.html" class="btn btn-secondary guest-only">Login</a>
            <a href="register.html" class="btn btn-primary guest-only">Register</a>
            <a href="#" class="btn btn-danger auth-only" id="logoutBtn" style="display: none;">Logout</a>
        </div>
    </nav>

    <!-- Contact Form Container -->
    <main class="container" style="display: flex; align-items: center; justify-content: center;">
        <div class="form-container">
            <h2 class="form-title">Get in Touch</h2>
            <p style="text-align:center; color: var(--text-secondary); margin-bottom: 1.5rem;">
                Have a question, suggestion, or issue? Send us a message below.
            </p>

            <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>
            <div id="successAlert" class="alert alert-success" style="display: none;"></div>

            <form id="contactForm">
                <div class="form-group">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" id="name" class="form-input" placeholder="e.g., John Doe" required minlength="2">
                    <span id="nameError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="e.g., farmer@domain.com" required>
                    <span id="emailError" class="form-error"></span>
                </div>

                <div class="form-group">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" class="form-input" rows="5" placeholder="Write your message here (at least 10 characters)..." required minlength="10"></textarea>
                    <span id="messageError" class="form-error"></span>
                </div>

                <button type="submit" class="btn btn-primary form-submit-btn">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 Crop Recommendation Agent. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthNavOnly();
        });

        const contactForm = document.getElementById('contactForm');
        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            resetFormErrors();
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                message: document.getElementById('message').value.trim()
            };

            try {
                showLoading(true);
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                showLoading(false);

                const result = await response.json();
                if (response.ok) {
                    successAlert.textContent = 'Thank you! Your message has been submitted.';
                    successAlert.style.display = 'block';
                    contactForm.reset();
                } else if (response.status === 400 && !result.error) {
                    for (const key in result) {
                        displayError(`${key}Error`, result[key]);
                    }
                } else {
                    errorAlert.textContent = result.error || 'Failed to submit your message. Try again.';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                showLoading(false);
                errorAlert.textContent = 'Server connection lost. Try again later.';
                errorAlert.style.display = 'block';
            }
        });
    </script>
</body>
</html>
